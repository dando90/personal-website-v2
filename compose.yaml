services:
  app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile

    working_dir: /workspace

    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules

    ports:
      - "5173:5173"

    command: ["sh", "-c", "npm ci && npm run dev -- --hostname 0.0.0.0"]

volumes:
  node_modules:
